name: Build TWRP Recovery for A145P

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP by GitHub Actions
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Setup Repositories & Install Build Dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo add-apt-repository multiverse -y
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip lib32z1-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Source Code
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree & Fix Symlink Conflicts
        run: |
          mkdir -p workspace/device/samsung/a145p
          cp -r device_tree/* workspace/device/samsung/a145p/
          
          # دانلود فایل کرنل
          curl -sLf "https://filebin.net/9pfd6vv4wk4bjllc/kernel" -o workspace/device/samsung/a145p/kernel

      - name: Building TWRP Image with Patch
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_a145p-eng || lunch omni_a145p-userdebug
          
          # ساخت اولیه ساختار پوشه‌ها و پاک‌سازی هوشمند تداخل vendor
          make -j$(nproc --all) recovery/root/vendor || true
          rm -rf out/target/product/a145p/root/vendor
          rm -rf out/target/product/a145p/recovery/root/vendor
          
          # اجرای بیلد اصلی ریکاوری
          make recoveryimage -j$(nproc --all)

      - name: Fast Package TAR
        run: |
          mkdir -p output
          cd workspace/out/target/product/a145p/
          
          if [ -f "recovery.img" ]; then
            echo "Packaging recovery.img..."
            tar -cvf twrp-A145P.tar recovery.img
            cp twrp-A145P.tar $GITHUB_WORKSPACE/output/
          elif [ -f "boot.img" ]; then
            echo "Packaging boot.img..."
            cp boot.img recovery.img
            tar -cvf twrp-A145P.tar recovery.img
            cp twrp-A145P.tar $GITHUB_WORKSPACE/output/
          else
            echo "ERROR: Image file not generated in standard directory!"
            exit 1
          fi


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Samsung_A145P
          path: output/
