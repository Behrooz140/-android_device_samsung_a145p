name: Build TWRP for Samsung A145P

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Check Out Device Tree
        uses: actions/checkout@v4
        with:
          path: device/samsung/a145p
          lfs: true

      - name: Set up Git LFS manually
        run: |
          cd device/samsung/a145p
          git lfs pull

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libncurses-dev libncurses6 libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 python3-pip python-is-python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Source
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Behrooz140"
          git config --global user.email "behrooz@example.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

      - name: Sync Sources
        run: |
          cd workspace
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags --fail-fast

      - name: Copy Device Tree to Workspace
        run: |
          mkdir -p workspace/device/samsung/a145p
          cp -r device/samsung/a145p/. workspace/device/samsung/a145p/
          chmod +x workspace/device/samsung/a145p/avb_digest_patch.py

      - name: Verify Device Tree Files
        run: |
          cd workspace/device/samsung/a145p
          echo "=== Checking Critical Build Files ==="
          for file in Android.mk Android.bp BoardConfig.mk recovery.fstab system.prop mkbootimg.mk avb_digest_patch.py; do
            if [ ! -f "$file" ]; then
              echo "❌ MISSING: $file"
            else
              echo "✅ FOUND: $file"
            fi
          done

      - name: Build TWRP
        run: |
          cd workspace
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a145p-userdebug
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Samsung-A145P
          path: workspace/out/target/product/a145p/recovery.img
